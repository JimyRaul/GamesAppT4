<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Concursos Regionales</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 1400px;
            width: 100%;
            position: relative;
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #f0f0f0;
        }

        h1 {
            color: #764ba2;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .status-bar {
            background: #f0f0f0;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 30px;
            display: none;
        }

        .status-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .progress {
            color: #555;
            font-weight: 600;
        }

        .used-questions {
            background: #e8f5e9;
            padding: 8px 12px;
            border-radius: 5px;
            color: #2e7d32;
            font-size: 0.9em;
        }

        .start-screen {
            text-align: center;
            /* padding: 60px 20px; */
        }

        .start-screen p {
            color: #666;
            font-size: 1.2em;
            margin-bottom: 30px;
        }

        .question-screen {
            display: none;
        }

        .question-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            align-items: start;
        }

        .left-section {
            padding-right: 20px;
        }

        .right-section {
            padding-left: 20px;
            border-left: 2px solid #f0f0f0;
        }

        .question-container {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            padding: 30px;
            border-radius: 15px;
            min-height: 400px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
            height: 100%;
        }

        .question-number {
            background: #764ba2;
            color: white;
            padding: 10px 20px;
            border-radius: 25px;
            display: inline-block;
            margin-bottom: 20px;
            font-weight: 600;
            font-size: 1.1em;
            position: absolute;
            top: 30px;
            left: 30px;
        }

        .question-text-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px 10px 10px 10px;
        }

        .question-text {
            font-size: clamp(1.5em, 4vw, 3.5em);
            color: #333;
            line-height: 1.3;
            font-weight: 800;
            text-align: center;
            word-wrap: break-word;
            hyphens: auto;
            font-family: 'Segoe UI Black', 'Arial Black', sans-serif;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .option {
            background: white;
            padding: 20px;
            border-radius: 12px;
            border: 3px solid #e0e0e0;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .option:hover:not(.revealed) {
            transform: translateX(10px);
            border-color: #764ba2;
            box-shadow: 0 5px 20px rgba(118, 75, 162, 0.2);
        }

        .option.correct {
            background: linear-gradient(135deg, #4caf50, #45a049);
            color: white;
            border-color: #4caf50;
            animation: pulse 0.6s ease;
            transform: scale(1.05);
        }

        .option.incorrect {
            background: #ffebee;
            border-color: #ef5350;
            opacity: 0.5;
            transform: scale(0.95);
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.08); }
            100% { transform: scale(1.05); }
        }

        .option-letter {
            background: #764ba2;
            color: white;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.3em;
            flex-shrink: 0;
        }

        .option.correct .option-letter {
            background: white;
            color: #4caf50;
        }

        .option-text {
            flex: 1;
            font-size: 1.2em;
            font-weight: 500;
        }

        .buttons-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 40px;
        }

        .btn {
            padding: 18px 40px;
            border: none;
            border-radius: 12px;
            font-size: 1.15em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            width: 100%;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(118, 75, 162, 0.3);
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #555;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
            transform: translateY(-2px);
        }

        .btn-success {
            background: linear-gradient(135deg, #4caf50, #45a049);
            color: white;
        }

        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(76, 175, 80, 0.3);
        }

        .reset-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #ef5350;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            display: none;
            z-index: 100;
        }

        .reset-btn:hover {
            background: #e53935;
            transform: scale(1.05);
        }

        .file-input-container {
            margin-bottom: 30px;
            text-align: center;
        }

        .file-input-label {
            background: #764ba2;
            color: white;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
            display: inline-block;
            transition: all 0.3s ease;
        }

        .file-input-label:hover {
            background: #5e3a8e;
        }

        #fileInput {
            display: none;
        }

        .file-status {
            margin-top: 15px;
            padding: 10px;
            border-radius: 8px;
            font-weight: 500;
        }

        .file-success {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .file-error {
            background: #ffebee;
            color: #c62828;
        }

        .end-screen {
            display: none;
            text-align: center;
            padding: 40px;
        }

        .trophy {
            font-size: 4em;
            margin-bottom: 20px;
        }

        .end-message {
            font-size: 1.5em;
            color: #333;
            margin-bottom: 30px;
        }

        @media (max-width: 968px) {
            .question-content {
                grid-template-columns: 1fr;
                gap: 30px;
            }
            
            .right-section {
                padding-left: 0;
                padding-top: 30px;
                border-left: none;
                border-top: 2px solid #f0f0f0;
            }
            
            .left-section {
                padding-right: 0;
            }
            
            .question-container {
                min-height: 300px;
            }
            
            .question-text {
                font-size: clamp(1.3em, 5vw, 2.5em);
            }
            
            h1 {
                font-size: 2em;
            }
            
            .btn {
                padding: 15px 30px;
                font-size: 1em;
            }
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }
            
            .question-text {
                font-size: 1.3em;
            }
            
            .option-text {
                font-size: 1em;
            }
            
            .buttons-container {
                margin-top: 25px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <button class="reset-btn" onclick="resetGame()">🔄 Reiniciar</button>
        
        <div class="header">
            <h1>🎯 Preguntas Aleatorias</h1>
        </div>

        <div class="status-bar" id="statusBar">
            <div class="status-info">
                <div class="progress">
                    Pregunta <span id="currentQuestion">0</span> de <span id="totalQuestions">0</span>
                </div>
                <div class="used-questions">
                    Respondidas: <span id="usedQuestions">0</span>
                </div>
            </div>
        </div>

        <div class="start-screen" id="startScreen">            
            <p><h2>¡Bienvenido a los concursos regionales - 2025!</h2></p>
            <img src="LogoEncuentro.png" alt="Logo del concurso" width="200">
            <div class="file-input-container">
                <label for="fileInput" class="file-input-label">
                    📁 Cargar archivo de preguntas.json
                </label>
                <input type="file" id="fileInput" accept=".json" onchange="loadQuestions(event)">
                <div id="fileStatus"></div>
            </div>
            <button class="btn btn-primary" onclick="startGame()" id="startButton" style="display: none;">
                ¡Iniciar Juego! 🚀
            </button>
        </div>

        <div class="question-screen" id="questionScreen">
            <div class="question-content">
                <div class="left-section">
                    <div class="question-container">
                        <div class="question-number" id="questionNumber">Pregunta #1</div>
                        <div class="question-text-wrapper">
                            <div class="question-text" id="questionText"></div>
                        </div>
                    </div>
                </div>
                
                <div class="right-section">
                    <div class="options-container" id="optionsContainer"></div>
                    
                    <div class="buttons-container">
                        <button class="btn btn-secondary" id="revealBtn" onclick="revealAnswer()">
                            👁️ Ver Respuesta
                        </button>
                        <button class="btn btn-success" id="nextBtn" onclick="nextQuestion()" style="display: none;">
                            Siguiente Pregunta ➡️
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div class="end-screen" id="endScreen">
            <div class="trophy">🏆</div>
            <div class="end-message">
                ¡Felicidades! Has completado todas las preguntas disponibles.
            </div>
            <button class="btn btn-primary" onclick="resetGame()">
                Jugar de Nuevo 🎮
            </button>
        </div>
    </div>

    <script>
        let questions = [];
        let usedQuestions = [];
        let currentQuestionIndex = -1;
        let isRevealed = false;
        let concursoData = {
            nombreConcurso: "🌟 Región Trujillo IV",
            categoria: ""
        };

        async function loadQuestions(event) {
            const file = event.target.files[0];
            const fileStatus = document.getElementById('fileStatus');
            
            if (file) {
                try {
                    const text = await file.text();
                    const data = JSON.parse(text);
                    
                    // Validar estructura del JSON
                    if (data.preguntas && Array.isArray(data.preguntas)) {
                        questions = data.preguntas;
                        // Guardar información del concurso
                        concursoData.nombreConcurso = data.nombreConcurso || "🎯 Preguntas Aleatorias";
                        concursoData.categoria = data.categoria || "";
                        // Actualizar el título y categoría
                        updateHeader();
                    } else if (Array.isArray(data)) {
                        questions = data;
                    } else if (data.pregunta) {
                        // Si es una sola pregunta, convertir a array
                        questions = [data];
                    } else {
                        throw new Error('Formato de archivo no válido');
                    }
                    
                    fileStatus.className = 'file-status file-success';
                    fileStatus.textContent = `✅ Archivo cargado: ${questions.length} preguntas disponibles`;
                    document.getElementById('startButton').style.display = 'inline-block';
                    document.getElementById('totalQuestions').textContent = questions.length;
                } catch (error) {
                    fileStatus.className = 'file-status file-error';
                    fileStatus.textContent = '❌ Error al cargar el archivo. Verifica el formato JSON.';
                    console.error('Error:', error);
                }
            }
        }

        function updateHeader() {
            const headerHTML = `
                <h1>${concursoData.nombreConcurso}</h1>
                <h3>${concursoData.categoria ? `<p style="color: #666; font-size: 1.2em; margin-top: 10px;">Categoría ${concursoData.categoria}</p>` : ''}</h3>
            `;
            document.querySelector('.header').innerHTML = headerHTML;
        }

        function startGame() {
            if (questions.length === 0) {
                alert('Por favor, carga un archivo de preguntas primero.');
                return;
            }
            
            document.getElementById('startScreen').style.display = 'none';
            document.getElementById('questionScreen').style.display = 'block';
            document.getElementById('statusBar').style.display = 'block';
            document.querySelector('.reset-btn').style.display = 'block';
            
            nextQuestion();
        }

        function getRandomQuestion() {
            const availableQuestions = questions.filter((q, index) => !usedQuestions.includes(index));
            
            if (availableQuestions.length === 0) {
                return null;
            }
            
            const randomIndex = Math.floor(Math.random() * availableQuestions.length);
            const questionIndex = questions.indexOf(availableQuestions[randomIndex]);
            
            usedQuestions.push(questionIndex);
            return questions[questionIndex];
        }

        function nextQuestion() {
            const question = getRandomQuestion();
            
            if (!question) {
                showEndScreen();
                return;
            }
            
            currentQuestionIndex++;
            isRevealed = false;
            
            // Actualizar estado
            document.getElementById('currentQuestion').textContent = usedQuestions.length;
            document.getElementById('usedQuestions').textContent = usedQuestions.length;
            
            // Usar el ID de la pregunta del JSON
            const questionId = question.id || usedQuestions.length;
            document.getElementById('questionNumber').textContent = `Pregunta #${questionId}`;
            
            // Mostrar pregunta
            const questionElement = document.getElementById('questionText');
            questionElement.textContent = question.pregunta;
            
            // Ajustar tamaño de fuente dinámicamente
            adjustFontSize(questionElement);
            
            // Mostrar opciones
            const optionsContainer = document.getElementById('optionsContainer');
            optionsContainer.innerHTML = '';
            
            question.alternativas.forEach(alt => {
                const optionDiv = document.createElement('div');
                optionDiv.className = 'option';
                optionDiv.dataset.correct = alt.esCorrecta;
                
                optionDiv.innerHTML = `
                    <div class="option-letter">${alt.opcion}</div>
                    <div class="option-text">${alt.respuesta}</div>
                `;
                
                optionsContainer.appendChild(optionDiv);
            });

            // Ajustar tamaño de fuente al redimensionar ventana
            window.addEventListener('resize', () => {
                const questionElement = document.getElementById('questionText');
                if (questionElement && questionElement.textContent) {
                    adjustFontSize(questionElement);
                }
            });
            
            // Resetear botones
            document.getElementById('revealBtn').style.display = 'block';
            document.getElementById('nextBtn').style.display = 'none';
        }

        function adjustFontSize(element) {
            const container = element.parentElement;
            const maxHeight = container.offsetHeight - 20;
            const maxWidth = container.offsetWidth - 20;
            const textLength = element.textContent.length;
            
            // Calcular tamaño base según la longitud del texto
            let fontSize;
            if (textLength < 50) {
                fontSize = 3.5; // em
            } else if (textLength < 100) {
                fontSize = 2.8;
            } else if (textLength < 150) {
                fontSize = 2.3;
            } else {
                fontSize = 1.8;
            }
            
            element.style.fontSize = fontSize + 'em';
            
            // Ajustar si el texto es muy alto
            while (element.scrollHeight > maxHeight && fontSize > 1.2) {
                fontSize -= 0.1;
                element.style.fontSize = fontSize + 'em';
            }
        }

        function revealAnswer() {
            if (isRevealed) return;
            
            isRevealed = true;
            const options = document.querySelectorAll('.option');
            
            options.forEach(option => {
                if (option.dataset.correct === 'true') {
                    option.classList.add('correct');
                } else {
                    option.classList.add('incorrect');
                }
            });
            
            document.getElementById('revealBtn').style.display = 'none';
            document.getElementById('nextBtn').style.display = 'block';
        }

        function showEndScreen() {
            document.getElementById('questionScreen').style.display = 'none';
            document.getElementById('endScreen').style.display = 'block';
        }

        function resetGame() {
            usedQuestions = [];
            currentQuestionIndex = -1;
            isRevealed = false;
            
            // Restaurar el título por defecto
            concursoData.nombreConcurso = "🎯 Preguntas Aleatorias";
            concursoData.categoria = "";
            updateHeader();
            
            document.getElementById('startScreen').style.display = 'block';
            document.getElementById('questionScreen').style.display = 'none';
            document.getElementById('endScreen').style.display = 'none';
            document.getElementById('statusBar').style.display = 'none';
            document.querySelector('.reset-btn').style.display = 'none';
            
            document.getElementById('currentQuestion').textContent = '0';
            document.getElementById('usedQuestions').textContent = '0';
        }

        // Crear archivo de ejemplo para descargar
        window.addEventListener('DOMContentLoaded', () => {
            const exampleData = {
                "nombreConcurso": "Concurso Regional - Ejemplo",
                "categoria": "General",
                "preguntas": [
                    {
                        "id": 1,
                        "pregunta": "¿Cuál es el planeta más cercano al Sol?",
                        "alternativas": [
                            {
                                "opcion": "A",
                                "respuesta": "Marte",
                                "esCorrecta": false
                            },
                            {
                                "opcion": "B",
                                "respuesta": "Venus",
                                "esCorrecta": true
                            },
                            {
                                "opcion": "C",
                                "respuesta": "Mercurio",
                                "esCorrecta": false
                            }
                        ]
                    },
                    {
                        "id": 2,
                        "pregunta": "¿Cuál es la capital de Francia?",
                        "alternativas": [
                            {
                                "opcion": "A",
                                "respuesta": "LONDRES",
                                "esCorrecta": false
                            },
                            {
                                "opcion": "B",
                                "respuesta": "BERLÍN",
                                "esCorrecta": false
                            },
                            {
                                "opcion": "C",
                                "respuesta": "PARÍS",
                                "esCorrecta": true
                            }
                        ]
                    },
                    {
                        "id": 3,
                        "pregunta": "¿En qué año llegó el hombre a la Luna?",
                        "alternativas": [
                            {
                                "opcion": "A",
                                "respuesta": "1969",
                                "esCorrecta": true
                            },
                            {
                                "opcion": "B",
                                "respuesta": "1970",
                                "esCorrecta": false
                            },
                            {
                                "opcion": "C",
                                "respuesta": "1968",
                                "esCorrecta": false
                            }
                        ]
                    }
                ]
            };
            
            // Añadir opción para usar datos de ejemplo
            const fileStatus = document.getElementById('fileStatus');
            const useExampleBtn = document.createElement('button');
            useExampleBtn.className = 'btn btn-secondary';
            useExampleBtn.textContent = '📋 Usar preguntas de ejemplo';
            useExampleBtn.style.marginTop = '15px';
            useExampleBtn.onclick = () => {
                questions = exampleData.preguntas;
                concursoData.nombreConcurso = exampleData.nombreConcurso;
                concursoData.categoria = exampleData.categoria;
                updateHeader();
                fileStatus.className = 'file-status file-success';
                fileStatus.textContent = `✅ Preguntas de ejemplo cargadas: ${questions.length} preguntas disponibles`;
                document.getElementById('startButton').style.display = 'inline-block';
                document.getElementById('totalQuestions').textContent = questions.length;
            };
            
            fileStatus.after(useExampleBtn);
            
            // Inicializar el header
            updateHeader();
        });
    </script>
</body>
</html>
